services:
  _defaults:
    public: false
    autowire: false
    autoconfigure: true

  Netzmacht\ContaoWorkflowBundle\Controller\Backend\StepController:
    arguments:
      - '@netzmacht.contao_workflow.manager'
      - '@netzmacht.contao_workflow.entity_manager'
      - '@netzmacht.contao_workflow.view.factory'
      - '@router'
      - '@security.authorization_checker'
    calls:
      - [setContainer, ["@service_container"]]

  Netzmacht\ContaoWorkflowBundle\Controller\Backend\TransitionController:
    arguments:
      - '@netzmacht.contao_workflow.manager'
      - '@netzmacht.contao_workflow.entity_manager'
      - '@netzmacht.contao_workflow.view.factory'
      - '@router'
      - '@netzmacht.contao_workflow.form.factory'
    calls:
      - [setContainer, ["@service_container"]]
